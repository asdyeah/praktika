<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fetch API</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
<header><h1>Практическая работа: Fetch API</h1></header>
<section>
<div class="task-area">
<h3>Задача 1: GET</h3>
<button id="fetch-get">Простой GET</button>
<button id="fetch-json">JSON данные</button>
<button id="fetch-error">Ошибка</button>
<div id="get-output" class="output"></div>
<div id="get-data" class="data-container"></div>
</div>
<div class="task-area">
<h3>Задача 2: CRUD</h3>
<button id="fetch-post">POST</button>
<button id="fetch-put">PUT</button>
<button id="fetch-patch">PATCH</button>
<button id="fetch-delete">DELETE</button>
<div id="crud-output" class="output"></div>
</div>
<div class="task-area">
<h3>Задача 3: Заголовки и параметры</h3>
<button id="fetch-headers">Заголовки</button>
<button id="fetch-auth">Авторизация</button>
<button id="fetch-params">Параметры</button>
<button id="fetch-timeout">Таймаут</button>
<div id="headers-output" class="output"></div>
</div>
<div class="task-area">
<h3>Задача 4: Обработка ответов</h3>
<button id="fetch-status">Статус</button>
<button id="fetch-headers-response">Заголовки ответа</button>
<button id="fetch-blob">Blob</button>
<button id="fetch-formdata">FormData</button>
<div id="response-output" class="output"></div>
<div id="response-data" class="data-container"></div>
</div>
<div class="task-area">
<h3>Задача 5: Ошибки</h3>
<button id="fetch-network-error">Сеть</button>
<button id="fetch-http-error">HTTP</button>
<button id="fetch-abort">Отмена</button>
<button id="fetch-retry">Retry</button>
<div id="error-output" class="output"></div>
</div>
<div class="task-area">
<h3>Задача 6: Параллельные</h3>
<button id="fetch-promise-all">Promise.all</button>
<button id="fetch-promise-race">Promise.race</button>
<button id="fetch-sequential">Последовательные</button>
<div id="parallel-output" class="output"></div>
</div>
<div class="task-area">
<h3>Задача 7: Сценарии</h3>
<button id="fetch-user-posts">Пользователь</button>
<button id="fetch-search">Поиск</button>
<button id="fetch-upload">Загрузка</button>
<button id="fetch-cache">Кэш</button>
<div id="scenario-output" class="output"></div>
<div id="scenario-data" class="data-container"></div>
<div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
</div>
</section>
<footer><p>Проверьте консоль</p></footer>
</div>
<script src="fetch-tasks.js"></script>
<script src="fetch-tests.js"></script>
</body>
</html>
