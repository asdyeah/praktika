<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вёрстка и валидация форм</title>
<link rel="stylesheet" href="reset.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
<header class="header">
<h1>Регистрация пользователя</h1>
<p>Заполните форму ниже</p>
</header>
<main class="main">
<form class="registration-form" id="registrationForm" novalidate>
<fieldset class="form-section">
<legend>Личная информация</legend>
<div class="form-group">
<label for="firstName">Имя</label>
<input type="text" id="firstName" name="firstName" required minlength="2" maxlength="50" placeholder="Ваше имя">
<span class="error-message" id="firstNameError"></span>
</div>
<div class="form-group">
<label for="lastName">Фамилия</label>
<input type="text" id="lastName" name="lastName" required minlength="2" maxlength="50" placeholder="Ваша фамилия">
<span class="error-message" id="lastNameError"></span>
</div>
<div class="form-group">
<label for="email">Email</label>
<input type="email" id="email" name="email" required placeholder="example@mail.com">
<span class="error-message" id="emailError"></span>
</div>
<div class="form-group">
<label for="phone">Телефон</label>
<input type="tel" id="phone" name="phone" placeholder="+7 (999) 999-99-99">
<span class="error-message" id="phoneError"></span>
</div>
</fieldset>
<fieldset class="form-section">
<legend>Безопасность</legend>
<div class="form-group">
<label for="password">Пароль</label>
<input type="password" id="password" name="password" required minlength="8" placeholder="Не менее 8 символов">
<span class="error-message" id="passwordError"></span>
</div>
<div class="form-group">
<label for="confirmPassword">Подтверждение пароля</label>
<input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Повторите пароль">
<span class="error-message" id="confirmPasswordError"></span>
</div>
</fieldset>
<fieldset class="form-section">
<legend>Дополнительно</legend>
<div class="form-group">
<label for="birthDate">Дата рождения</label>
<input type="date" id="birthDate" name="birthDate" min="1900-01-01" max="2024-12-31">
</div>
<div class="form-group">
<label for="country">Страна</label>
<select id="country" name="country">
<option value="">Выберите</option>
<option value="ru">Россия</option>
<option value="kz">Казахстан</option>
<option value="by">Беларусь</option>
</select>
</div>
<div class="form-group">
<label for="bio">О себе</label>
<textarea id="bio" name="bio" rows="4" placeholder="Расскажите о себе..." maxlength="500"></textarea>
<div class="char-counter"><span id="charCount">0</span>/500</div>
</div>
</fieldset>
<div class="form-section">
<div class="form-actions">
<button type="submit" class="btn btn-primary">Зарегистрироваться</button>
<button type="reset" class="btn btn-secondary">Очистить</button>
</div>
</div>
</form>
</main>
<footer class="footer"><p>&copy; 2024 Формы и валидация</p></footer>
</div>
<script src="script.js"></script>
</body>
</html>
